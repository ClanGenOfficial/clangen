name: Failure Comment (Schema)
on:
  workflow_run:
    workflows: ["Schema_Diff"]
    types: [completed]

permissions:
  pull-requests: write

jobs:
  comment:
    if: >
      github.event.workflow_run.conclusion == 'failure'
      && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            let prNumber = run.pull_requests?.[0]?.number;

            if (!prNumber) {
              const { data: pulls } = await github.rest.pulls.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                head: `${run.head_repository.owner.login}:${run.head_branch}`,
              });
              if (!pulls.length) {
                console.log('No PR found for this workflow run');
                return;
              }
              prNumber = pulls[0].number;
            }

            const body = `### Schemas are stale

            Please regenerate the JSON schemas by running the command below and committing the results:

            \`\`\`sh
            uv run dump_model_schemas
            \`\`\``;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });


            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body,
            });

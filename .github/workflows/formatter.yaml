name: Formatter
on: [pull_request]
jobs:
  formatter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true
          prune-cache: true
      - name: install dependencies
        run: uv sync
      - name: Run Formatter
        run: uv run black --check --diff .

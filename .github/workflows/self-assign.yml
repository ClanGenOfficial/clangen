name: Assign Issue

on:
  # for automatic unassigning for inactivity
  schedule:
    - cron: 0 0 * * *
  issue_comment:
    types: [created]

jobs:
  assign:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Assign user or unassign inactive self-assigned issue
        uses: takanome-dev/assign-issue-action@v3.1.0
        with:
          github_token: '${{ secrets.GITHUB_TOKEN }}'
          days_until_unassign: 30
